name: 每天更新 IP 数据库并上传到 R2

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ========== 1. 下载 ip2region v4 + v6（GitHub）==========
      - name: 下载 ip2region 离线库
        run: |
          echo "========== ip2region v4 =========="
          IP2REGION_V4=""
          for url in \
            "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb"; do
            echo "尝试: $url"
            if curl -fsSL -o ip2region_v4.xdb "$url"; then
              fs=$(stat -c%s ip2region_v4.xdb 2>/dev/null || echo 0)
              if [ "$fs" -gt 1000000 ]; then
                echo "✅ ip2region_v4.xdb 下载成功 ($fs bytes)"
                md5sum ip2region_v4.xdb > ip2region_v4.xdb.md5
                IP2REGION_V4="ok"
                break
              else
                echo "⚠️ 文件过小 ($fs)，跳过"
                rm -f ip2region_v4.xdb
              fi
            else
              echo "⚠️ 下载失败"
            fi
          done
          [ -z "$IP2REGION_V4" ] && echo "❌ ip2region_v4.xdb 下载失败"

          echo ""
          echo "========== ip2region v6 =========="
          IP2REGION_V6=""
          for url in \
            "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v6.xdb"; do
            echo "尝试: $url"
            if curl -fsSL -o ip2region_v6.xdb "$url"; then
              fs=$(stat -c%s ip2region_v6.xdb 2>/dev/null || echo 0)
              if [ "$fs" -gt 100000 ]; then
                echo "✅ ip2region_v6.xdb 下载成功 ($fs bytes)"
                md5sum ip2region_v6.xdb > ip2region_v6.xdb.md5
                IP2REGION_V6="ok"
                break
              else
                echo "⚠️ 文件过小 ($fs)，跳过"
                rm -f ip2region_v6.xdb
              fi
            else
              echo "⚠️ 下载失败"
            fi
          done
          [ -z "$IP2REGION_V6" ] && echo "❌ ip2region_v6.xdb 下载失败"

          ls -lh ip2region_v4.xdb ip2region_v6.xdb 2>/dev/null || true
      
      # ========== 2. 下载纯真标准版数据库 ==========
      - name: 下载纯真标准版 IP 数据库
        run: |
          echo "开始下载纯真标准版 IP 数据库..."
          curl -L -o qqwry.ipdb \
            "https://github.com/nmgliangwei/qqwry.ipdb/releases/latest/download/qqwry.ipdb"
          
          file_size=$(stat -c%s qqwry.ipdb)
          echo "纯真数据库大小: $file_size 字节"
          
          if [ $file_size -lt 1000000 ]; then
            echo "❌ 纯真数据库下载失败（文件太小）"
            exit 1
          fi
          
          echo "✅ 纯真数据库下载成功"
          ls -lh qqwry.ipdb
          md5sum qqwry.ipdb > qqwry.ipdb.md5

      # ========== 3. 提取 china.full.gtc（GeoToolCN 中国高精度逆地理）==========
      # china.full.gtc 不在 GitHub 源码仓库，是 npm 包发布时注入的二进制数据，
      # 需通过 npm pack tarball 下载再解压
      - name: 提取 china.full.gtc (GeoToolCN)
        run: |
          echo "========== china.full.gtc =========="
          GTC_OK=""
          (
            npm pack @geotoolcn/core --silent && \
            tar -xzf geotoolcn-core-*.tgz && \
            cp package/data/china.full.gtc ./china.full.gtc
          ) || true
          rm -rf package geotoolcn-core-*.tgz 2>/dev/null || true

          if [ -f china.full.gtc ]; then
            fs=$(stat -c%s china.full.gtc 2>/dev/null || echo 0)
            if [ "$fs" -gt 1000000 ]; then
              echo "✅ china.full.gtc 提取成功 ($fs bytes)"
              md5sum china.full.gtc > china.full.gtc.md5
              GTC_OK="ok"
            else
              echo "❌ china.full.gtc 文件过小 ($fs)"
              rm -f china.full.gtc
            fi
          else
            echo "❌ china.full.gtc 提取失败"
          fi
          [ -z "$GTC_OK" ] && echo "❌ china.full.gtc 无法获取（GitHub 无公开 raw 源，npm 包下载也失败）"
          ls -lh china.full.gtc 2>/dev/null || true

      # ========== 4. 下载 geo-intel-offline 全球逆地理数据 ==========
      - name: 下载 geo-intel-offline 全球逆地理数据
        run: |
          echo "========== geo-intel-offline data =========="
          GI_OK=0
          for f in polygons.json.gz metadata.json.gz geohash_index.json.gz; do
            echo ""
            echo "--- $f ---"
            OK=""
            for url in \
              "https://raw.githubusercontent.com/RRJena/geo-intel-offline-javascript/main/data/$f"; do
              echo "尝试: $url"
              if curl -fsSL -o "$f" "$url"; then
                fs=$(stat -c%s "$f" 2>/dev/null || echo 0)
                min=1000
                [ "$f" = "polygons.json.gz" ] && min=1000000
                if [ "$fs" -gt "$min" ]; then
                  echo "✅ $f 下载成功 ($fs bytes)"
                  md5sum "$f" > "$f.md5"
                  OK="ok"
                  break
                else
                  echo "⚠️ 文件过小 ($fs)，跳过"
                  rm -f "$f"
                fi
              else
                echo "⚠️ 下载失败"
              fi
            done
            if [ -z "$OK" ]; then
              echo "❌ $f 下载失败"
            else
              GI_OK=$((GI_OK + 1))
            fi
          done
          echo ""
          echo "geo-intel: $GI_OK / 3 下载成功"
          ls -lh polygons.json.gz metadata.json.gz geohash_index.json.gz 2>/dev/null || true
      
      # ========== 5. 安装上传工具 ==========
      - name: 安装 s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd
      
      # ========== 6. 上传到 R2 ==========
      - name: 上传到 R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then
            echo "❌ R2 secrets 未配置"
            exit 1
          fi

          cat > ~/.s3cfg << EOF
          [default]
          access_key = $R2_ACCESS_KEY
          secret_key = $R2_SECRET_KEY
          host_base = $(echo $R2_ENDPOINT | sed 's|https://||')
          host_bucket = $(echo $R2_ENDPOINT | sed 's|https://||')
          use_https = True
          EOF

          # ip2region
          if [ -f ip2region_v4.xdb ]; then
            s3cmd put ip2region_v4.xdb s3://$R2_BUCKET/ip2region_v4.xdb
            s3cmd put ip2region_v4.xdb.md5 s3://$R2_BUCKET/ip2region_v4.xdb.md5
            echo "✅ ip2region_v4.xdb 已上传"
          else
            echo "⚠️ ip2region_v4.xdb 不存在，跳过"
          fi

          if [ -f ip2region_v6.xdb ]; then
            s3cmd put ip2region_v6.xdb s3://$R2_BUCKET/ip2region_v6.xdb
            s3cmd put ip2region_v6.xdb.md5 s3://$R2_BUCKET/ip2region_v6.xdb.md5
            echo "✅ ip2region_v6.xdb 已上传"
          else
            echo "⚠️ ip2region_v6.xdb 不存在，跳过"
          fi
          
          # 纯真
          if [ -f qqwry.ipdb ]; then
            s3cmd put qqwry.ipdb s3://$R2_BUCKET/qqwry.ipdb
            s3cmd put qqwry.ipdb.md5 s3://$R2_BUCKET/qqwry.ipdb.md5
            echo "✅ 纯真数据库已上传"
          fi

          # china.full.gtc (GeoCN)
          if [ -f china.full.gtc ]; then
            s3cmd put china.full.gtc s3://$R2_BUCKET/china.full.gtc
            s3cmd put china.full.gtc.md5 s3://$R2_BUCKET/china.full.gtc.md5
            echo "✅ china.full.gtc 已上传"
          else
            echo "⚠️ china.full.gtc 不存在，跳过"
          fi

          # geo-intel-offline (全球逆地理)
          for f in polygons.json.gz metadata.json.gz geohash_index.json.gz; do
            if [ -f "$f" ]; then
              s3cmd put "$f" "s3://$R2_BUCKET/$f"
              s3cmd put "$f.md5" "s3://$R2_BUCKET/$f.md5"
              echo "✅ $f 已上传"
            else
              echo "⚠️ $f 不存在，跳过"
            fi
          done
          
          echo "✅ 所有文件上传完成"
      
      # ========== 7. 创建版本信息 ==========
      - name: 创建版本信息
        run: |
          echo "更新时间: $(date '+%Y-%m-%d %H:%M:%S')" > version.txt
          echo "===================================" >> version.txt
          echo "" >> version.txt
          echo "【IP 归属地】" >> version.txt
          echo "  ip2region_v4.xdb: $(if [ -f ip2region_v4.xdb ]; then echo '✅ '$(ls -lh ip2region_v4.xdb | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  ip2region_v6.xdb: $(if [ -f ip2region_v6.xdb ]; then echo '✅ '$(ls -lh ip2region_v6.xdb | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  qqwry.ipdb:       $(if [ -f qqwry.ipdb ]; then echo '✅ '$(ls -lh qqwry.ipdb | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "" >> version.txt
          echo "【GPS 逆地理】" >> version.txt
          echo "  china.full.gtc:         $(if [ -f china.full.gtc ]; then echo '✅ '$(ls -lh china.full.gtc | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  polygons.json.gz:       $(if [ -f polygons.json.gz ]; then echo '✅ '$(ls -lh polygons.json.gz | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  metadata.json.gz:       $(if [ -f metadata.json.gz ]; then echo '✅ '$(ls -lh metadata.json.gz | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  geohash_index.json.gz:  $(if [ -f geohash_index.json.gz ]; then echo '✅ '$(ls -lh geohash_index.json.gz | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "" >> version.txt
          echo "来源:" >> version.txt
          echo "  ip2region:    github.com/lionsoul2014/ip2region" >> version.txt
          echo "  qqwry:        github.com/nmgliangwei/qqwry.ipdb" >> version.txt
          echo "  china.full.gtc:  github.com/ljxi/GeoCN" >> version.txt
          echo "  geo-intel:    github.com/RRJena/geo-intel-offline-javascript" >> version.txt
          echo "===================================" >> version.txt
          cat version.txt
      
      # ========== 8. 提交并推送 ==========
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || true
          
          # 数据文件
          git add ip2region_v4.xdb ip2region_v4.xdb.md5 2>/dev/null || true
          git add ip2region_v6.xdb ip2region_v6.xdb.md5 2>/dev/null || true
          git add qqwry.ipdb qqwry.ipdb.md5 2>/dev/null || true
          git add china.full.gtc china.full.gtc.md5 2>/dev/null || true
          git add polygons.json.gz metadata.json.gz geohash_index.json.gz 2>/dev/null || true
          git add polygons.json.gz.md5 metadata.json.gz.md5 geohash_index.json.gz.md5 2>/dev/null || true
          git add version.txt
          
          git diff --staged --quiet || git commit -m "🤖 更新 IP + GPS 数据库 - $(date '+%Y-%m-%d')

          - ip2region v4/v6: $(if [ -f ip2region_v4.xdb ]; then echo '✅'; else echo '❌'; fi)
          - qqwry 纯真:       $(if [ -f qqwry.ipdb ]; then echo '✅'; else echo '❌'; fi)
          - china.full.gtc:   $(if [ -f china.full.gtc ]; then echo '✅'; else echo '❌'; fi)
          - geo-intel 3份:    $(ls polygons.json.gz metadata.json.gz geohash_index.json.gz 2>/dev/null | wc -l)/3"
          
          git pull origin main --rebase || true
          git push origin main
