name: 每天更新 IP 数据库并上传到 R2

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ========== 1. 下载 ip2region v4 + v6（Gitee 主，GitHub 回退）==========
      - name: 下载 ip2region 离线库
        run: |
          echo "========== ip2region v4 =========="
          IP2REGION_V4=""
          for url in \
            "https://gitee.com/lionsoul/ip2region/raw/master/data/ip2region_v4.xdb" \
            "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb"; do
            echo "尝试: $url"
            if curl -fsSL -o ip2region_v4.xdb "$url"; then
              fs=$(stat -c%s ip2region_v4.xdb 2>/dev/null || echo 0)
              if [ "$fs" -gt 1000000 ]; then
                echo "✅ ip2region_v4.xdb 下载成功 ($fs bytes)"
                md5sum ip2region_v4.xdb > ip2region_v4.xdb.md5
                IP2REGION_V4="ok"
                break
              else
                echo "⚠️ 文件过小 ($fs)，跳过"
                rm -f ip2region_v4.xdb
              fi
            else
              echo "⚠️ 下载失败"
            fi
          done
          [ -z "$IP2REGION_V4" ] && echo "❌ ip2region_v4.xdb 所有源均失败"

          echo ""
          echo "========== ip2region v6 =========="
          IP2REGION_V6=""
          for url in \
            "https://gitee.com/lionsoul/ip2region/raw/master/data/ip2region_v6.xdb" \
            "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v6.xdb"; do
            echo "尝试: $url"
            if curl -fsSL -o ip2region_v6.xdb "$url"; then
              fs=$(stat -c%s ip2region_v6.xdb 2>/dev/null || echo 0)
              if [ "$fs" -gt 100000 ]; then
                echo "✅ ip2region_v6.xdb 下载成功 ($fs bytes)"
                md5sum ip2region_v6.xdb > ip2region_v6.xdb.md5
                IP2REGION_V6="ok"
                break
              else
                echo "⚠️ 文件过小 ($fs)，跳过"
                rm -f ip2region_v6.xdb
              fi
            else
              echo "⚠️ 下载失败"
            fi
          done
          [ -z "$IP2REGION_V6" ] && echo "❌ ip2region_v6.xdb 所有源均失败"

          ls -lh ip2region_v4.xdb ip2region_v6.xdb 2>/dev/null || true
      
      # ========== 2. 下载纯真标准版数据库 ==========
      - name: 下载纯真标准版 IP 数据库
        run: |
          echo "开始下载纯真标准版 IP 数据库..."
          curl -L -o qqwry.ipdb \
            "https://github.com/nmgliangwei/qqwry.ipdb/releases/latest/download/qqwry.ipdb"
          
          file_size=$(stat -c%s qqwry.ipdb)
          echo "纯真数据库大小: $file_size 字节"
          
          if [ $file_size -lt 1000000 ]; then
            echo "❌ 纯真数据库下载失败（文件太小）"
            exit 1
          fi
          
          echo "✅ 纯真数据库下载成功"
          ls -lh qqwry.ipdb
          md5sum qqwry.ipdb > qqwry.ipdb.md5
      
      # ========== 3. 从 GitHub 下载 GeoCN 数据库 ==========
      - name: 从 GitHub 下载 GeoCN 中国高精度数据库
        run: |
          echo "开始从 GitHub 下载 GeoCN 数据库..."
          
          echo "尝试从 GitHub Release 下载..."
          curl -L -o GeoCN.mmdb \
            "https://github.com/ljxi/GeoCN/releases/latest/download/GeoCN.mmdb"
          
          if [ -f GeoCN.mmdb ]; then
            file_size=$(stat -c%s GeoCN.mmdb)
            echo "下载文件大小: $file_size 字节"
            
            if [ $file_size -gt 100000 ]; then
              echo "✅ GeoCN 数据库下载成功"
              ls -lh GeoCN.mmdb
              md5sum GeoCN.mmdb > GeoCN.mmdb.md5
            else
              echo "⚠️ 文件过小，尝试从仓库直接下载..."
              curl -L -o GeoCN.mmdb \
                "https://raw.githubusercontent.com/ljxi/GeoCN/main/db/GeoCN.mmdb"
              
              file_size2=$(stat -c%s GeoCN.mmdb)
              if [ $file_size2 -gt 100000 ]; then
                echo "✅ GeoCN 数据库下载成功（从仓库）"
                ls -lh GeoCN.mmdb
                md5sum GeoCN.mmdb > GeoCN.mmdb.md5
              else
                echo "❌ GeoCN 数据库下载失败"
                rm -f GeoCN.mmdb
              fi
            fi
          else
            echo "❌ GeoCN 数据库下载失败"
          fi
      
      # ========== 4. 下载行政区划数据 (用于 GeoCN division_code 解析) ==========
      - name: 下载行政区划数据 (full.txt / short.txt)
        run: |
          echo "开始下载行政区划数据..."
          
          curl -L -o full.txt \
            "https://raw.githubusercontent.com/ljxi/GeoCN/main/data/full.txt"
          
          if [ -f full.txt ]; then
            fs=$(stat -c%s full.txt)
            echo "full.txt 大小: $fs 字节"
            if [ $fs -gt 1000 ]; then
              echo "✅ full.txt 下载成功"
              md5sum full.txt > full.txt.md5
            else
              echo "❌ full.txt 下载失败（文件太小）"
              rm -f full.txt
            fi
          else
            echo "❌ full.txt 下载失败"
          fi
          
          curl -L -o short.txt \
            "https://raw.githubusercontent.com/ljxi/GeoCN/main/data/short.txt"
          
          if [ -f short.txt ]; then
            fs=$(stat -c%s short.txt)
            echo "short.txt 大小: $fs 字节"
            if [ $fs -gt 1000 ]; then
              echo "✅ short.txt 下载成功"
              md5sum short.txt > short.txt.md5
            else
              echo "❌ short.txt 下载失败（文件太小）"
              rm -f short.txt
            fi
          else
            echo "❌ short.txt 下载失败"
          fi
      
      # ========== 5. 安装上传工具 ==========
      - name: 安装 s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd
      
      # ========== 6. 上传到 R2 ==========
      - name: 上传到 R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then
            echo "❌ R2 secrets 未配置"
            exit 1
          fi

          cat > ~/.s3cfg << EOF
          [default]
          access_key = $R2_ACCESS_KEY
          secret_key = $R2_SECRET_KEY
          host_base = $(echo $R2_ENDPOINT | sed 's|https://||')
          host_bucket = $(echo $R2_ENDPOINT | sed 's|https://||')
          use_https = True
          EOF

          # ip2region
          if [ -f ip2region_v4.xdb ]; then
            s3cmd put ip2region_v4.xdb s3://$R2_BUCKET/ip2region_v4.xdb
            s3cmd put ip2region_v4.xdb.md5 s3://$R2_BUCKET/ip2region_v4.xdb.md5
            echo "✅ ip2region_v4.xdb 已上传"
          else
            echo "⚠️ ip2region_v4.xdb 不存在，跳过"
          fi

          if [ -f ip2region_v6.xdb ]; then
            s3cmd put ip2region_v6.xdb s3://$R2_BUCKET/ip2region_v6.xdb
            s3cmd put ip2region_v6.xdb.md5 s3://$R2_BUCKET/ip2region_v6.xdb.md5
            echo "✅ ip2region_v6.xdb 已上传"
          else
            echo "⚠️ ip2region_v6.xdb 不存在，跳过"
          fi
          
          # 纯真
          s3cmd put qqwry.ipdb s3://$R2_BUCKET/qqwry.ipdb
          s3cmd put qqwry.ipdb.md5 s3://$R2_BUCKET/qqwry.ipdb.md5
          echo "✅ 纯真数据库已上传"
          
          # GeoCN
          if [ -f GeoCN.mmdb ]; then
            s3cmd put GeoCN.mmdb s3://$R2_BUCKET/GeoCN.mmdb
            s3cmd put GeoCN.mmdb.md5 s3://$R2_BUCKET/GeoCN.mmdb.md5
            echo "✅ GeoCN 数据库已上传"
          else
            echo "⚠️ GeoCN 不存在，跳过"
          fi
          
          # 行政区划
          if [ -f full.txt ]; then
            s3cmd put full.txt s3://$R2_BUCKET/data/full.txt
            s3cmd put full.txt.md5 s3://$R2_BUCKET/data/full.txt.md5
            echo "✅ full.txt 已上传"
          fi
          if [ -f short.txt ]; then
            s3cmd put short.txt s3://$R2_BUCKET/data/short.txt
            s3cmd put short.txt.md5 s3://$R2_BUCKET/data/short.txt.md5
            echo "✅ short.txt 已上传"
          fi
          
          echo "✅ 所有文件上传完成"
      
      # ========== 7. 创建版本信息 ==========
      - name: 创建版本信息
        run: |
          echo "更新时间: $(date '+%Y-%m-%d %H:%M:%S')" > version.txt
          echo "===================================" >> version.txt
          echo "ip2region 离线库:" >> version.txt
          echo "  ip2region_v4.xdb: $(if [ -f ip2region_v4.xdb ]; then echo '✅ '$(ls -lh ip2region_v4.xdb | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  ip2region_v6.xdb: $(if [ -f ip2region_v6.xdb ]; then echo '✅ '$(ls -lh ip2region_v6.xdb | awk '{print $5}'); else echo '❌ 下载失败'; fi)" >> version.txt
          echo "  来源: Gitee lionsoul/ip2region" >> version.txt
          echo "" >> version.txt
          echo "纯真数据库 (标准版):" >> version.txt
          echo "  文件: qqwry.ipdb" >> version.txt
          echo "  大小: $(ls -lh qqwry.ipdb | awk '{print $5}')" >> version.txt
          echo "  MD5: $(cut -d' ' -f1 qqwry.ipdb.md5)" >> version.txt
          echo "" >> version.txt
          if [ -f GeoCN.mmdb ]; then
            echo "GeoCN 数据库:" >> version.txt
            echo "  文件: GeoCN.mmdb" >> version.txt
            echo "  大小: $(ls -lh GeoCN.mmdb | awk '{print $5}')" >> version.txt
            echo "  MD5: $(cut -d' ' -f1 GeoCN.mmdb.md5)" >> version.txt
            echo "✅ GeoCN 已下载" >> version.txt
          else
            echo "GeoCN: ❌ 下载失败" >> version.txt
          fi
          
          echo "" >> version.txt
          echo "===================================" >> version.txt
      
      # ========== 8. 提交并推送 ==========
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || true
          
          git add ip2region_v4.xdb ip2region_v4.xdb.md5 2>/dev/null || true
          git add ip2region_v6.xdb ip2region_v6.xdb.md5 2>/dev/null || true
          git add qqwry.ipdb qqwry.ipdb.md5
          git add GeoCN.mmdb GeoCN.mmdb.md5 2>/dev/null || true
          git add full.txt full.txt.md5 short.txt short.txt.md5 2>/dev/null || true
          git add version.txt
          
          git diff --staged --quiet || git commit -m "🤖 更新 IP 数据库 - $(date '+%Y-%m-%d')

          - ip2region v4/v6: $(if [ -f ip2region_v4.xdb ]; then echo '已更新'; else echo '部分失败'; fi)
          - 纯真标准版: 日常更新
          - GeoCN 高精度: $(if [ -f GeoCN.mmdb ]; then echo '已更新'; else echo '下载失败'; fi)
          - 行政区划数据: $(if [ -f full.txt ] && [ -f short.txt ]; then echo '已更新'; else echo '部分失败'; fi)"
          
          git pull origin main --rebase || true
          git push origin main
